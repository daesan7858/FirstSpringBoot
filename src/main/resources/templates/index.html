<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>보물섬 퀴즈 탐험</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <script>    
      /*  function notify(i) {
            // 동적 문자열 만들기
            // 1. 동적 문자열을 무조건 `...` 구성
            // 2. `ㅎㅇ! {변수명}` => "ㅎㅇ! 변수내용이 출력"
            // 3. {가변데이터} => 정적데이터로 생성 => "변환된 정적문자열"
            // 4. 가변문자열은 `${변수명} 입니다.` 형식 
            let msg = `${i} 번째 버튼이 눌려짐`;
            alert(msg);
        }       위와 아래는 똑같다 */

        let say = function (i) {
            let msg = `${i}번째 버튼이 눌려짐`;
            alert(msg);
        }

    </script>

    <div class="game-header">
        <h1>🏝️ 보물섬 퀴즈 탐험</h1>
        <div class="score-badge">😎점수 0점</div>
    </div> 

    <div class="treasure-row">
        <div class="treasure">💎보석</div>
        <div class="treasure">🎁황금</div>
        <div class="treasure">🌎보물지도</div>
    </div>

    <!-- main 태그 위에 자바스크립트(DOM)으로 HTML요소 제어-->
    <main class="quiz-grid">

        <button 
        onclick="say(0)"
        class="treasure-card special"
        data-index="0">🎁보물 1</button>
        <button 
        onclick="say(1)" 
        class="treasure-card1"
        data-index="1">🎁보물 2</button>
        <button 
        onclick="say(2)"
        class="treasure-card2"
        data-index="2">🎁보물 3</button>
        <button 
        onclick="notify(3)"
        class="treasure-card"
        data-index="3">🎁보물 4</button>
        <button 
        class="treasure-card"
        data-index="4">🎁보물 5</button>
        <button 
        class="treasure-card"
        data-index="5">🎁보물 6</button>
        <button 
        class="treasure-card"
        data-index="6">🎁보물 7</button>
        <button 
        class="treasure-card"
        data-index="7">🎁보물 8</button>
        <button 
        class="treasure-card"
        data-index="8">🎁보물 9</button>
    </main>
    <script>
        let treasureCard_special_find = document.querySelector(".treasure-card.special");
        treasureCard_special_find.textContent = "Eureka! 스페셜 보물상자를 찾았어!"
    </script>

    <!-- 보물상자를 누르면 질문이 나오는 패널 추가-->
    <section class="question-panel">
        <h2>보물상자별<strong>🧩오늘의 퀴즈</strong></h2>
        <p id="question-text">보물상자를 선택해 문제를 푸시오!!</p>
    </section>

    <script src="/js/game.js" />
</body>
</html>
